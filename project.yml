name: OutdoorLog
options:
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  OutdoorLog:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ['Resources/**', '*.entitlements', 'Info.plist']
      - path: Shared
      - path: Watch/Protocol/WatchWire.swift
      - path: Watch/Protocol/WatchRecoveryPolicy.swift
      - path: iOS/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heznpc.outdoorlog
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS: iOS/OutdoorLog.entitlements
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: OutdoorLog
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: 가까운 운동기구를 찾고 직선 거리를 표시할 때 현재 위치를 사용합니다.
        NSHealthShareUsageDescription: 허용한 활동과 운동 이력을 확인하고 개인 장소 기록에 연결합니다. 건강 데이터는 자체 서버로 전송하지 않습니다.
        NSHealthUpdateUsageDescription: 직접 기록한 운동을 사용자가 선택할 때 Apple 건강에 저장합니다.
    dependencies:
      - target: OutdoorLogWatch
        embed: true
  OutdoorLogWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes: ['*.entitlements', 'Info.plist']
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heznpc.outdoorlog.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Watch/OutdoorLogWatch.entitlements
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: OutdoorLog
        WKApplication: true
        WKCompanionAppBundleIdentifier: app.heznpc.outdoorlog
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: 운동 중 심박수와 활동량, 오늘의 걸음 수를 표시합니다.
        NSHealthUpdateUsageDescription: Apple Watch에서 기록한 운동을 Apple 건강에 저장합니다.
  OutdoorLogTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OutdoorLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.heznpc.outdoorlog.tests
    info:
      path: Tests/Info.plist
schemes:
  OutdoorLog:
    build:
      targets:
        OutdoorLog: all
    test:
      targets: [OutdoorLogTests]
  OutdoorLogWatch:
    build:
      targets:
        OutdoorLogWatch: all
